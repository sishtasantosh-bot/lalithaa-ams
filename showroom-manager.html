<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a1f2b">
<title>Showroom Manager</title>
<style>
:root{--pri:#7a1f2b;--pri2:#a33445;--gold:#c9a227;--bg:#f6f3ee;--card:#fff;--txt:#222;--mut:#777;--ok:#2e7d32;--warn:#e08a00;--bad:#c62828;--bd:#e5ded3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding-bottom:78px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:16px}
.datebar input{flex:1;border:0;border-radius:8px;padding:6px 8px;font-size:14px;background:#fff;color:#222}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--bd)}
.card h2{margin:0 0 10px;font-size:16px;color:var(--pri);display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;border:1px solid var(--bd)}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--mut)}
.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:1px}
.task .t{flex:1}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#f1e9dc;color:#6b5320;margin-left:4px;vertical-align:middle}
.tag.high{background:#fde2e2;color:var(--bad)}.tag.med{background:#fff1d6;color:#9a5d00}.tag.low{background:#e3f1e4;color:var(--ok)}
.tag.over{background:var(--bad);color:#fff}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.gr{background:var(--ok)}.btn.rd{background:var(--bad)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.item{padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .ttl{font-weight:600}
.item .meta{font-size:12px;color:var(--mut);margin:3px 0 7px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:30}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--mut)}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:16px;bottom:86px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;border:0;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:25}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d6cdbf;border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h3{margin:0 0 6px;color:var(--pri)}
.alertbox{position:fixed;top:10px;left:10px;right:10px;background:#fff8e1;border:2px solid var(--warn);border-radius:14px;padding:12px;z-index:60;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.alertbox.show{display:block}
.banner{background:#fff1d6;border:1px solid #f0d08a;color:#7a4b00;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;min-width:34px}
.att button.on.P{background:var(--ok);color:#fff}.att button.on.A{background:var(--bad);color:#fff}.att button.on.L{background:var(--warn);color:#fff}.att button.on.H{background:#5c6bc0;color:#fff}.att button.on.W{background:#888;color:#fff}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.srow:last-child{border-bottom:0}
.tgt{margin-bottom:12px}
.tgt .top{display:flex;justify-content:space-between;font-size:13px}
.tgt .top b{font-size:14px}
.tgt .hint{font-size:11px;color:var(--mut);margin-top:3px}
pre.rep{white-space:pre-wrap;background:#faf7f2;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px;font-family:inherit}
.hidden{display:none}
.blockhead{font-size:13px;font-weight:700;color:var(--pri);margin:6px 0 2px;display:flex;justify-content:space-between}
.small{font-size:12px;color:var(--mut)}
.rt{overflow-x:auto}
.rt table{border-collapse:collapse;width:100%;font-size:12px}
.rt th,.rt td{border:1px solid var(--bd);padding:5px 6px;text-align:right;white-space:nowrap}
.rt th{background:#f6efe3;color:var(--pri)}
.rt td:first-child,.rt th:first-child{text-align:left}
.rt tr.tot td{font-weight:700;background:#faf3e6}
.rt tr.off td{color:#999}
.rt tr.miss td{background:#fff4f4}
.rhead{text-align:center;margin-bottom:10px}
.rhead h2{justify-content:center;font-size:18px;margin:0}
@media print{header,nav,.fab,.noprint,#toast{display:none!important}body{padding:0;background:#fff;font-size:12px}main{padding:0}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid}textarea{border:0;padding:0}}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">Showroom Manager</h1>
  <div class="sub" id="hSub"></div>
  <div class="datebar">
    <button onclick="shiftDay(-1)">‹</button>
    <input type="date" id="dateSel" onchange="setDay(this.value)">
    <button onclick="shiftDay(1)">›</button>
    <button onclick="setDay(todayStr())" style="font-size:12px">Today</button>
  </div>
</header>

<div class="alertbox" id="alertBox">
  <b>⏰ Reminder</b>
  <div id="alertText" style="margin:6px 0 10px;font-size:15px"></div>
  <div class="row">
    <button class="btn gr sm" onclick="alertDone()">Done</button>
    <button class="btn sec sm" onclick="alertSnooze(15)">Snooze 15 min</button>
    <button class="btn sec sm" onclick="alertSnooze(60)">1 hour</button>
    <button class="btn sec sm" onclick="closeAlert()">Close</button>
  </div>
</div>

<main id="main"></main>

<button class="fab" id="fab" onclick="fabAction()">+</button>

<nav>
  <button data-tab="today" class="on" onclick="go('today')"><span class="ic">✅</span>Today</button>
  <button data-tab="rem" onclick="go('rem')"><span class="ic">⏰</span>Reminders</button>
  <button data-tab="iss" onclick="go('iss')"><span class="ic">🛠️</span>Follow-ups</button>
  <button data-tab="sales" onclick="go('sales')"><span class="ic">📈</span>Sales</button>
  <button data-tab="staff" onclick="go('staff')"><span class="ic">👥</span>Staff</button>
  <button data-tab="more" onclick="go('more')"><span class="ic">☰</span>More</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== Storage ===== */
const KEY='smApp_v1';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const BLOCKS=[
 {id:'opening',name:'🌅 Opening (9:00 – 9:30)'},
 {id:'meeting',name:'📣 Morning Meeting (9:30 – 10:00)'},
 {id:'midday',name:'☀️ Mid-day (10:00 – 4:00)'},
 {id:'evening',name:'🌆 Evening Peak (4:00 – 8:00)'},
 {id:'closing',name:'🌙 Closing (8:00 – 10:00)'}
];
const REM_CATS=['Head Office','Sales / Targets','Staff / HR','Stock','Scheme','Customer','Vendor','Maintenance','Audit','Meeting','Personal','Other'];
const ISS_CATS=['Electrical','UPS / Inverter','AC','Lift','Fire Alarm','CCTV / Security','Network / Systems','Pest Control','Plumbing / Drainage','Signboard / Lighting','Housekeeping','Stock / Tag Issue','Vendor Pending','Customer Complaint','Staff / HR','Other'];
let uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function defaults(){
 const T=(title,block,freq,day)=>({id:uid(),title,block,freq,day:day??null});
 return {
  settings:{branch:'Lalithaa Jewellery Mart – Kakinada',manager:'',map:{gold:'Gold',diamond:'Dia Cts',silver:'Silver',scheme:'New Chit Amount',prebook:'Total Collection Amount'},weeklyOff:2,targetDays:'all',
   targets:{gold:1500,diamond:1.33,silver:5000,scheme:2200000,prebook:18200000}},
  tasks:[
   T('Gate opening with security – dual custody, keys log','opening','daily'),
   T('Check CCTV, alarm, lights, AC, UPS all working','opening','daily'),
   T('Opening stock tally / tray count at all counters','opening','daily'),
   T('Staff attendance & grooming check','opening','daily'),
   T('Showroom cleaning & display ready before customers','opening','daily'),
   T('Morning meeting – targets, schemes, key instructions','meeting','daily'),
   T('Share yesterday sales & today target with team','meeting','daily'),
   T('Floor walk – customer service & counter coverage','midday','daily'),
   T('Check walk-in & non-conversion entries','midday','daily'),
   T('Follow up pending vendor / maintenance issues','midday','daily'),
   T('Reply head office emails & approvals','midday','daily'),
   T('Lunch break rotation – no counter left empty','midday','daily'),
   T('Peak hour floor supervision','evening','daily'),
   T('Scheme enrolment push – review count','evening','daily'),
   T('Pending orders / repairs / deliveries follow-up','evening','daily'),
   T('Daily sales report sent to head office','closing','daily'),
   T('Closing stock tally / tray count','closing','daily'),
   T('Cash & petty cash verification','closing','daily'),
   T('Strong room locked, keys handed over','closing','daily'),
   T('Alarm set, lights / AC off, security handover','closing','daily'),
   T('Counter shuffling plan for next week','midday','weekly',3),
   T('Aged stock review','midday','weekly',4),
   T('Staff target vs achievement review','evening','weekly',6),
   T('Safety walk – fire extinguishers, exits clear','opening','weekly',0),
   T('Fire alarm & extinguisher check','opening','monthly',1),
   T('Pest control done / scheduled','midday','monthly',5),
   T('AC / UPS / DG service follow-up','midday','monthly',10),
   T('Aged & damaged stock report','midday','monthly',15),
   T('Staff performance review','evening','monthly',25),
   T('Monthly sales report & next month target plan','closing','monthly',31)
  ],
  done:{},reminders:[],issues:[],sales:{},
  staff:[],att:{},alerted:{}
 };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – storage blocked')}}

/* ===== Dates ===== */
function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return dstr(new Date())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s){const d=parseD(s);return d.getDate()+' '+d.toLocaleString('en-IN',{month:'short'})+' '+d.getFullYear()+', '+DAYS[d.getDay()].slice(0,3)}
function fmtT(t){if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap}
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function inr(n){n=Number(n)||0;if(n>=1e7)return'₹'+(n/1e7).toFixed(2)+' Cr';if(n>=1e5)return'₹'+(n/1e5).toFixed(2)+' L';return'₹'+n.toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let DAY=todayStr(),TAB='today',remFilter='today',issFilter='open';

function setDay(v){if(!v)return;DAY=v;render()}
function shiftDay(n){DAY=addDays(DAY,n);render()}

/* ===== Tasks for a day ===== */
function tasksFor(ds){
 const d=parseD(ds),wd=d.getDay(),md=d.getDate(),last=daysIn(d.getFullYear(),d.getMonth());
 return S.tasks.filter(t=>t.freq==='daily'||(t.freq==='weekly'&&t.day==wd)||(t.freq==='monthly'&&(t.day==md||(t.day>last&&md===last))));
}
function toggleTask(id){S.done[DAY]=S.done[DAY]||{};S.done[DAY][id]=!S.done[DAY][id];save();render()}

/* ===== Reminders ===== */
function remDT(r){return new Date(r.date+'T'+(r.time||'09:00'))}
function remOver(r){return !r.done&&remDT(r)<new Date()}
function nextDate(r){
 if(r.repeat==='daily')return addDays(r.date,1);
 if(r.repeat==='weekly')return addDays(r.date,7);
 if(r.repeat==='monthly'){const d=parseD(r.date);const day=r.mday||d.getDate();let y=d.getFullYear(),m=d.getMonth()+1;if(m>11){m=0;y++}return dstr(new Date(y,m,Math.min(day,daysIn(y,m))))}
 return null;
}
function remDone(id){
 const r=S.reminders.find(x=>x.id===id);if(!r)return;
 const nd=nextDate(r);
 if(nd){r.date=nd;delete S.alerted[r.id];toast('Done. Next: '+fmtD(nd))}else{r.done=true;r.doneOn=todayStr();toast('Marked done')}
 save();render();
}
function remSnooze(id,mins){
 const r=S.reminders.find(x=>x.id===id);if(!r)return;
 const t=new Date(Date.now()+mins*60000);r.date=dstr(t);r.time=pad(t.getHours())+':'+pad(t.getMinutes());r.done=false;delete S.alerted[r.id];save();render();toast('Snoozed to '+fmtT(r.time))
}
function remTomorrow(id){const r=S.reminders.find(x=>x.id===id);r.date=addDays(todayStr(),1);r.done=false;delete S.alerted[r.id];save();render();toast('Moved to tomorrow')}
function gcal(r){
 const s=remDT(r),e=new Date(s.getTime()+30*60000);
 const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
 let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(r.title)+'&dates='+f(s)+'/'+f(e)+'&details='+encodeURIComponent((r.cat||'')+(r.notes?' – '+r.notes:''))+'&ctz=Asia/Kolkata';
 if(r.repeat&&r.repeat!=='none')u+='&recur='+encodeURIComponent('RRULE:FREQ='+r.repeat.toUpperCase());
 return u;
}

/* ===== Alarm checker ===== */
let curAlert=null;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){} if(navigator.vibrate)navigator.vibrate([300,150,300])}
function checkAlarms(){
 const now=new Date();
 for(const r of S.reminders){
  if(r.done||S.alerted[r.id+r.date+r.time])continue;
  if(remDT(r)<=now&&now-remDT(r)<12*3600e3){
   S.alerted[r.id+r.date+r.time]=1;save();curAlert=r.id;
   document.getElementById('alertText').innerHTML=esc(r.title)+'<div class="small">'+esc(r.cat||'')+' · '+fmtT(r.time)+'</div>';
   document.getElementById('alertBox').classList.add('show');beep();
   try{if('Notification'in window&&Notification.permission==='granted')new Notification('Showroom reminder',{body:r.title})}catch(e){}
   break;
  }
 }
}
function closeAlert(){document.getElementById('alertBox').classList.remove('show');curAlert=null}
function alertDone(){if(curAlert)remDone(curAlert);closeAlert()}
function alertSnooze(m){if(curAlert)remSnooze(curAlert,m);closeAlert()}
setInterval(checkAlarms,20000);

/* ===== Navigation ===== */
function go(t){TAB=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));window.scrollTo(0,0);render()}
function fabAction(){({today:()=>editRem(),rem:()=>editRem(),iss:()=>editIss(),sales:()=>{},staff:()=>editStaff(),more:()=>{},report:()=>{}})[TAB]()}

function render(){
 document.getElementById('dateSel').value=DAY;
 document.getElementById('hTitle').textContent='Showroom Manager';
 document.getElementById('hSub').textContent=S.settings.branch+' · '+fmtD(DAY);
 const fab=document.getElementById('fab');fab.classList.toggle('hidden',TAB==='sales'||TAB==='more'||TAB==='report');
 const m=document.getElementById('main');
 m.innerHTML={today:vToday,rem:vRem,iss:vIss,sales:vSales,staff:vStaff,more:vMore,report:vReport}[TAB]();
}

/* ===== Today view ===== */
function vToday(){
 const ts=tasksFor(DAY),dn=S.done[DAY]||{},cnt=ts.filter(t=>dn[t.id]).length,pct=ts.length?Math.round(cnt/ts.length*100):0;
 const over=S.reminders.filter(remOver).length;
 const dueToday=S.reminders.filter(r=>!r.done&&r.date===DAY).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const openIss=S.issues.filter(i=>i.status!=='Closed').length;
 const sd=S.sales[DAY]||{},gt=S.settings.targets.gold,gp=gt?Math.round((+sd.gold||0)/gt*100):0;
 const isOff=parseD(DAY).getDay()==S.settings.weeklyOff;
 let h='';
 if(isOff)h+='<div class="banner">🏖️ '+DAYS[S.settings.weeklyOff]+' is your weekly off. Take rest – only urgent items below.</div>';
 h+='<div class="stats">'+
 '<div class="stat"><div class="n">'+cnt+'/'+ts.length+'</div><div class="l">Checklist done</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
 '<div class="stat" onclick="remFilter=\'overdue\';go(\'rem\')"><div class="n" style="color:'+(over?'var(--bad)':'var(--ok)')+'">'+over+'</div><div class="l">Overdue reminders</div></div>'+
 '<div class="stat" onclick="go(\'iss\')"><div class="n" style="color:'+(openIss?'var(--warn)':'var(--ok)')+'">'+openIss+'</div><div class="l">Open follow-ups</div></div>'+
 '<div class="stat" onclick="go(\'sales\')"><div class="n">'+(+sd.gold||0)+' g</div><div class="l">Gold today ('+gp+'% of '+gt+' g)</div><div class="bar"><i style="width:'+Math.min(gp,100)+'%;background:var(--gold)"></i></div></div>'+
 '</div>';
 h+='<div class="card"><h2>Due today <small>'+dueToday.length+'</small></h2>';
 h+=dueToday.length?dueToday.map(remItem).join(''):'<div class="empty">No reminders for this day. Tap + to add.</div>';
 h+='</div>';
 h+='<div class="card"><h2>Daily checklist <small>'+pct+'% done</small></h2>';
 for(const b of BLOCKS){
  const bt=ts.filter(t=>t.block===b.id);if(!bt.length)continue;
  const bd=bt.filter(t=>dn[t.id]).length;
  h+='<div class="blockhead"><span>'+b.name+'</span><span class="small">'+bd+'/'+bt.length+'</span></div>';
  h+=bt.map(t=>'<div class="task'+(dn[t.id]?' done':'')+'"><input type="checkbox" '+(dn[t.id]?'checked':'')+' onchange="toggleTask(\''+t.id+'\')"><div class="t">'+esc(t.title)+(t.freq!=='daily'?'<span class="tag">'+t.freq+'</span>':'')+'</div></div>').join('');
 }
 h+='<div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="go(\'more\');setTimeout(()=>editTasks(),50)">Edit checklist</button><button class="btn sec sm" onclick="markAll()">Mark all done</button></div></div>';
 return h;
}
function markAll(){if(!confirm('Mark all checklist items done for this day?'))return;S.done[DAY]=S.done[DAY]||{};tasksFor(DAY).forEach(t=>S.done[DAY][t.id]=true);save();render()}

/* ===== Reminders view ===== */
function remItem(r){
 const o=remOver(r);
 return '<div class="item"><div class="ttl">'+esc(r.title)+' <span class="tag '+(r.priority||'med')+'">'+({high:'High',med:'Medium',low:'Low'}[r.priority||'med'])+'</span>'+(o?'<span class="tag over">Overdue</span>':'')+'</div>'+
 '<div class="meta">'+fmtD(r.date)+' · '+fmtT(r.time)+' · '+esc(r.cat||'')+(r.repeat&&r.repeat!=='none'?' · 🔁 '+r.repeat:'')+(r.notes?'<br>'+esc(r.notes):'')+'</div>'+
 '<div class="acts">'+(r.done?'<button class="btn sm sec" onclick="reopenRem(\''+r.id+'\')">Reopen</button>':

/* ===== Read sale report image (OCR) ===== */
const RLABELS=['Gold','G.Amt','Coin','C.Amt','MK','OG','OG Amt','FG','FG Amt','Dia Cts','Dia.Amt','Ruby','Chipa','Geti','Polki','Antik','Temp','Blr','Platinum','Bombay','Calcutta','Cutting Chain','Holo Chain','MCC','MCB','Bombay Bangles CJ','Casting MMF','H.H.Chain','H.H.Necklace','Chain','Silver','Silver Coin','Old Silver','New Member Chit','New Chit Amount','Close Member Chit','Total Collection Weight','Total Collection Amount','Closing Weight','Closing Amount'];
function getMap(){return S.settings.map||{gold:'Gold',diamond:'Dia Cts',silver:'Silver',scheme:'New Chit Amount',prebook:'Total Collection Amount'}}
function normL(x){return String(x).toLowerCase().replace(/[^a-z0-9]/g,'')}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i]}for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchLabel(t){const n=normL(t);if(!n)return null;let best=null,bs=0;for(const L of RLABELS){const l=normL(L);const sc=1-lev(n,l)/Math.max(n.length,l.length);if(sc>bs){bs=sc;best=L}}return bs>=0.55?best:null}
function loadTess(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not load the reader. Check internet.'));document.head.appendChild(sc)})}
function ocrProg(t){openModal('<h3>Reading report…</h3><div class="small" id="ocrMsg">'+t+'</div><div class="bar" style="margin-top:12px"><i id="ocrBar" style="width:5%"></i></div><div class="small" style="margin-top:10px">First time takes longer (downloads the reader). Keep internet on.</div>')}
function ocrStep(t,p){const m=document.getElementById('ocrMsg'),b=document.getElementById('ocrBar');if(m)m.textContent=t;if(b)b.style.width=Math.round(p)+'%'}
function groupsOf(x){const g=[];for(const v of x){if(g.length&&v-g[g.length-1][1]<=3)g[g.length-1][1]=v;else g.push([v,v])}return g}
function cellCanvas(src,x0,y0,x1,y1){const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0),sc=3,pad=20,c=document.createElement('canvas');c.width=w*sc+pad*2;c.height=h*sc+pad*2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingEnabled=true;g.drawImage(src,x0,y0,w,h,pad,pad,w*sc,h*sc);
 const id=g.getImageData(0,0,c.width,c.height),d=id.data;for(let i=0;i<d.length;i+=4){const y=0.3*d[i]+0.59*d[i+1]+0.11*d[i+2],v=y<150?0:255;d[i]=d[i+1]=d[i+2]=v}g.putImageData(id,0,0);return c}
function inkRatio(src,x0,y0,x1,y1){const w=x1-x0,h=y1-y0;if(w<2||h<2)return 0;const d=src.getContext('2d').getImageData(x0,y0,w,h).data;let k=0;for(let i=0;i<d.length;i+=4)if(d[i]+d[i+1]+d[i+2]<330)k++;return k/(w*h)}
function cleanNum(t){t=String(t||'').replace(/[^0-9.]/g,'').replace(/^\.+|\.+$/g,'');const p=t.split('.');if(p.length>2)t=p[0]+'.'+p.slice(1).join('');return t}
async function ocrStart(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 ocrProg('Loading image…');
 try{
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)});
  let W=img.naturalWidth,H=img.naturalHeight,k=1;if(W>1400){k=1400/W}else if(W<300){k=2}
  W=Math.round(W*k);H=Math.round(H*k);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.drawImage(img,0,0,W,H);
  const d=g.getImageData(0,0,W,H).data,dk=(x,y)=>{const i=(y*W+x)*4;return d[i]+d[i+1]+d[i+2]<330};
  const rows=[],cols=[];
  for(let y=0;y<H;y++){let c=0;for(let x=0;x<W;x++)if(dk(x,y))c++;if(c/W>0.6)rows.push(y)}
  for(let x=0;x<W;x++){let c=0;for(let y=0;y<H;y++)if(dk(x,y))c++;if(c/H>0.6)cols.push(x)}
  const R=groupsOf(rows),C=groupsOf(cols);
  ocrStep('Starting reader…',10);await loadTess();
  const worker=await Tesseract.createWorker('eng');
  let items=[],date=null;
  if(R.length>=6&&C.length>=1){
   const vx0=C.length>=2?C[C.length-2][1]+2:C[0][1]+2,vx1=C.length>=2?C[C.length-1][0]-1:W-1;
   const lx0=C.length>=3?C[C.length-3][1]+2:(C.length>=2?0:0),lx1=vx0-3;
   const cells=[];if(R[0][0]>8)cells.push({y0:0,y1:R[0][0]-1,head:true});
   for(let i=0;i<R.length-1;i++){const y0=R[i][1]+2,y1=R[i+1][0]-1;if(y1-y0>5)cells.push({y0,y1})}
   if(H-R[R.length-1][1]>8)cells.push({y0:R[R.length-1][1]+2,y1:H-1});
   await worker.setParameters({tessedit_pageseg_mode:'7'});
   let n=0;
   for(const c of cells){
    n++;ocrStep('Reading line '+n+' of '+cells.length+'…',10+85*n/cells.length);
    const lt=(await worker.recognize(cellCanvas(cv,lx0,c.y0,lx1,c.y1))).data.text.trim();
    const vt=(await worker.recognize(cellCanvas(cv,vx0,c.y0,vx1,c.y1))).data.text.trim();
    const dm=(lt+' '+vt).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(dm&&!date){let yy=+dm[3];if(yy<100)yy+=2000;date=yy+'-'+pad(+dm[2])+'-'+pad(+dm[1]);continue}
    if(c.head)continue;
    let val=cleanNum(vt),flag=false;
    if(val===''){flag=inkRatio(cv,vx0,c.y0,vx1,c.y1)>0.01;val=flag?'':'0';if(!flag)val='0'}
    items.push({raw:lt,label:matchLabel(lt),value:val,flag:flag||val===''});
   }
   // fall back to template order when labels unreadable but count matches
   if(items.length===RLABELS.length)items.forEach((it,i)=>{if(!it.label)it.label=RLABELS[i]});
  }else{
   await worker.setParameters({tessedit_pageseg_mode:'6'});ocrStep('Reading whole image…',40);
   const t=(await worker.recognize(cv)).data.text;
   const dm=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(dm){let yy=+dm[3];if(yy<100)yy+=2000;date=yy+'-'+pad(+dm[2])+'-'+pad(+dm[1])}
   t.split('\n').forEach(line=>{const m=line.match(/^(.*?)[\s|:\]\[]*([0-9][0-9.,]*)\s*\]?\s*$/);if(!m)return;const lab=matchLabel(m[1]);if(lab)items.push({raw:m[1],label:lab,value:cleanNum(m[2]),flag:false})});

function monthData(ds){
 const d=parseD(ds),y=d.getFullYear(),m=d.getMonth(),n=daysIn(y,m),mk=ds.slice(0,7),T=S.settings.targets,today=todayStr();
 const all=[];for(let i=1;i<=n;i++)all.push(dstr(new Date(y,m,i)));
 const tdays=monthDays(ds);
 const endD=today.slice(0,7)===mk?today:(today<mk+'-01'?mk+'-01':all[n-1]);
 const shown=all.filter(x=>x<=endD);
 const rows=shown.map(x=>{const s=S.sales[x],off=parseD(x).getDay()==S.settings.weeklyOff;return {date:x,off,has:!!s&&Object.keys(s).length>0,s:s||{}}});
 const tot={};SF.forEach(f=>tot[f[0]]=0);rows.forEach(r=>SF.forEach(f=>tot[f[0]]+=+r.s[f[0]]||0));
 const entered=rows.filter(r=>r.has).length,missing=rows.filter(r=>!r.has&&!r.off&&r.date<today).map(r=>r.date);
 const tdUpto=tdays.filter(x=>x<=endD).length;
 const cats=[['gold','Gold','g',T.gold*tdays.length,2],['diamond','Diamond','ct',T.diamond*tdays.length,2],['silver','Silver','g',T.silver*tdays.length,0],['scheme','Monthly Scheme','₹',T.scheme,0],['prebook','Pre-Booking','₹',T.prebook,0]].map(([k,name,u,tg,dp])=>{
  const a=tot[k],tillDate=tg*tdUpto/tdays.length;
  let best=null;rows.forEach(r=>{const x=+r.s[k]||0;if(x>0&&(!best||x>best.v))best={v:x,d:r.date}});
  const metDays=(k==='gold'||k==='diamond'||k==='silver')?rows.filter(r=>(+r.s[k]||0)>=T[k]).length:null;
  return {k,name,u,tg,tillDate,a,pct:tg?a/tg*100:0,pctTill:tillDate?a/tillDate*100:0,avg:entered?a/entered:0,best,metDays,dp};
 });
 const weeks=[];for(let w=0;w<5;w++){const ds2=rows.filter(r=>{const dd=parseD(r.date).getDate();return dd>w*7&&dd<=(w+1)*7});if(!ds2.length)continue;const o={label:'Week '+(w+1)+' ('+parseD(ds2[0].date).getDate()+'–'+parseD(ds2[ds2.length-1].date).getDate()+')'};SF.forEach(f=>o[f[0]]=ds2.reduce((a,r)=>a+(+r.s[f[0]]||0),0));weeks.push(o)}
 const staff=S.staff.map(st=>{const c={P:0,A:0,L:0,H:0,W:0};Object.keys(S.att).forEach(k=>{if(k.slice(0,7)===mk&&S.att[k][st.id])c[S.att[k][st.id]]++});const wd=c.P+c.H+c.A+c.L;return {name:st.name,c,pct:wd?Math.round((c.P+c.H*0.5)/wd*100):null}});
 let tDone=0,tAll=0;shown.forEach(x=>{const ts=tasksFor(x),dn=S.done[x]||{};if(parseD(x).getDay()==S.settings.weeklyOff)return;tAll+=ts.length;tDone+=ts.filter(t=>dn[t.id]).length});
 const raised=S.issues.filter(i=>(i.raised||'').slice(0,7)===mk),closed=S.issues.filter(i=>(i.closedOn||'').slice(0,7)===mk),open=S.issues.filter(i=>i.status!=='Closed');
 return {mk,label:d.toLocaleString('en-IN',{month:'long',year:'numeric'}),rows,tot,entered,missing,cats,weeks,staff,chk:{done:tDone,all:tAll},raised,closed,open,endD,full:endD===all[n-1]};
}

];
function vMore(){
 let h='<div class="card"><h2>📲 Daily report for WhatsApp</h2><div class="small">Report for '+fmtD(DAY)+'. Copy or share to head office / staff group.</div><pre class="rep" id="rep">'+esc(buildReport())+'</pre><div class="row"><button class="btn sm" onclick="copyTxt(\'rep\')">Copy</button><button class="btn sm sec" onclick="shareTxt(\'rep\')">Share / WhatsApp</button></div></div>';
 h+='<div class="card"><h2>📣 Morning meeting message</h2><div class="small" style="margin-bottom:6px">Choose the points for today:</div>'+MEET.map((m,i)=>'<label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:14px;margin:6px 0"><input type="checkbox" style="width:20px;height:20px" class="mp" value="'+i+'" '+(i<4?'checked':'')+' onchange="buildMeet()">'+m[0]+'</label>').join('')+
 '<label>Extra instruction (optional)</label><input id="mx" oninput="buildMeet()" placeholder="e.g. Audit team visiting today"><pre class="rep" id="meet"></pre><div class="row"><button class="btn sm" onclick="copyTxt(\'meet\')">Copy</button><button class="btn sm sec" onclick="shareTxt(\'meet\')">Share / WhatsApp</button></div></div>';
 h+='<div class="card"><h2>⚙️ Settings</h2>'+
 '<label>Branch name</label><input id="se_b" value="'+esc(S.settings.branch)+'">'+
 '<label>Your name (for report signature)</label><input id="se_m" value="'+esc(S.settings.manager)+'">'+
 '<label>Weekly off</label><select id="se_w">'+opts(DAYS.map((d,i)=>[i,d]),S.settings.weeklyOff)+'</select>'+
 '<label>Count target days</label><select id="se_td">'+opts([['all','All days of the month'],['work','Exclude weekly off days']],S.settings.targetDays)+'</select>'+
 '<div class="g2"><div><label>Gold target / day (g)</label><input type="number" step="any" id="se_g" value="'+S.settings.targets.gold+'"></div><div><label>Diamond / day (ct)</label><input type="number" step="any" id="se_d" value="'+S.settings.targets.diamond+'"></div>'+
 '<div><label>Silver / day (g)</label><input type="number" step="any" id="se_s" value="'+S.settings.targets.silver+'"></div><div><label>Monthly Scheme / month (₹)</label><input type="number" step="any" id="se_sc" value="'+S.settings.targets.scheme+'"></div>'+
 '<div><label>Pre-Booking / month (₹)</label><input type="number" step="any" id="se_pb" value="'+S.settings.targets.prebook+'"></div></div>'+
 '<label style="margin-top:14px"><b>Image reading – which report line fills each figure</b></label><div class="g2">'+[['gold','Gold (g)'],['diamond','Diamond (ct)'],['silver','Silver (g)'],['scheme','Monthly Scheme (₹)'],['prebook','Pre-Booking (₹)']].map(([k,l])=>'<div><label>'+l+'</label><select id="mp_'+k+'">'+opts([['','– none –']].concat(RLABELS.map(x=>[x,x])),getMap()[k])+'</select></div>').join('')+'</div>'+
 '<div class="row" style="margin-top:12px"><button class="btn" onclick="saveSet()">Save settings</button><button class="btn sec" onclick="editTasks()">Edit daily checklist</button></div></div>';
 h+='<div class="card"><h2>💾 Backup</h2><div class="small" style="margin-bottom:8px">Data stays on this phone. Take a backup every week, or before clearing browser data.</div><div class="row"><button class="btn sm" onclick="backup()">Download backup</button><button class="btn sm sec" onclick="document.getElementById(\'imp\').click()">Restore backup</button><button class="btn sm sec" onclick="salesCSV()">Sales to Excel (CSV)</button></div><input type="file" id="imp" accept=".json" class="hidden" onchange="restore(this)">'+
 '<button class="btn sm rd" style="margin-top:12px" onclick="resetAll()">Reset everything</button></div>';
 setTimeout(buildMeet,0);
 return h;
}
function buildReport(){
 const ts=tasksFor(DAY),dn=S.done[DAY]||{},pend=ts.filter(t=>!dn[t.id]);
 const s=S.sales[DAY]||{},a=S.att[DAY]||{},T=S.settings.targets;
 let c={P:0,A:0,L:0,H:0,W:0};Object.values(a).forEach(x=>{if(c[x]!==undefined)c[x]++});
 const open=S.issues.filter(i=>i.status!=='Closed');
 let r='*Daily Report – '+S.settings.branch+'*\nDate: '+fmtD(DAY)+'\n\n*Sales*\nGold: '+(+s.gold||0)+' g (Target '+T.gold+' g)\nDiamond: '+(+s.diamond||0)+' ct (Target '+T.diamond+' ct)\nSilver: '+(+s.silver||0)+' g (Target '+T.silver+' g)\nMonthly Scheme: '+inr(s.scheme)+'\nPre-Booking: '+inr(s.prebook)+'\nWalk-ins: '+(+s.footfall||0)+' | Converted: '+(+s.conv||0)+(s.footfall?' ('+Math.round((s.conv||0)/s.footfall*100)+'%)':'');
 if(S.staff.length)r+='\n\n*Staff*\nPresent: '+c.P+(c.H?' | Half day: '+c.H:'')+' | Leave: '+c.L+' | Absent: '+c.A+' | Week off: '+c.W;
 r+='\n\n*Checklist*: '+(ts.length-pend.length)+'/'+ts.length+' completed';
 if(pend.length)r+='\nPending: '+pend.slice(0,6).map(t=>t.title).join('; ')+(pend.length>6?' (+'+(pend.length-6)+' more)':'');
 r+='\n\n*Open follow-ups*: '+open.length;
 open.slice(0,6).forEach((i,n)=>r+='\n'+(n+1)+'. '+i.title+' – '+i.status+' ('+diffDays(i.raised,todayStr())+' days)');
 r+='\n\nRegards,\n'+(S.settings.manager?S.settings.manager+'\n':'')+'Showroom Manager';
 return r;
}
function buildMeet(){
 const el=document.getElementById('meet');if(!el)return;
 const T=S.settings.targets,sel=[...document.querySelectorAll('.mp:checked')].map(x=>+x.value);
 let pts=sel.map(i=>MEET[i][1].replace('{gold}',T.gold).replace('{diamond}',T.diamond).replace('{silver}',T.silver));
 const x=(document.getElementById('mx')||{}).value;if(x&&x.trim())pts.push(x.trim());
 el.textContent='Good morning Team,\n\nPlease ensure the following points are followed today:\n'+pts.map((p,i)=>(i+1)+'. '+p).join('\n')+'\n\nLet us give our best today. Please take this seriously and ensure compliance.\n\n– Showroom Manager';
}
function copyTxt(id){const t=document.getElementById(id).textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied')})}
function shareTxt(id){const t=document.getElementById(id).textContent;if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
function saveSet(){
 S.settings.branch=v('se_b')||S.settings.branch;S.settings.manager=v('se_m');S.settings.weeklyOff=+v('se_w');S.settings.targetDays=v('se_td');
 S.settings.map={};['gold','diamond','silver','scheme','prebook'].forEach(k=>S.settings.map[k]=v('mp_'+k));
 S.settings.targets={gold:+v('se_g')||0,diamond:+v('se_d')||0,silver:+v('se_s')||0,scheme:+v('se_sc')||0,prebook:+v('se_pb')||0};
 save();render();toast('Settings saved');
}
function editTasks(){
 const fq=t=>t.freq==='daily'?'Daily':t.freq==='weekly'?'Every '+DAYS[t.day]:'Monthly on day '+t.day;
 let h='<h3>Daily checklist</h3><div class="small">Add or remove activities. Weekly and monthly ones show only on their day.</div>';
 for(const b of BLOCKS){const bt=S.tasks.filter(t=>t.block===b.id);h+='<div class="blockhead" style="margin-top:12px">'+b.name+'</div>'+bt.map(t=>'<div class="srow"><span style="font-size:14px">'+esc(t.title)+'<div class="small">'+fq(t)+'</div></span><button class="btn sm rd" onclick="delTask(\''+t.id+'\')">✕</button></div>').join('')}
 h+='<div class="card" style="margin-top:14px"><b>Add activity</b><label>Activity</label><input id="tk_t" placeholder="e.g. Check gold rate board updated">'+
 '<div class="g2"><div><label>Time block</label><select id="tk_b">'+opts(BLOCKS.map(b=>[b.id,b.name.replace(/^\S+\s/,'')]))+'</select></div><div><label>How often</label><select id="tk_f" onchange="document.getElementById(\'tk_dw\').style.display=this.value===\'weekly\'?\'block\':\'none\';document.getElementById(\'tk_dm\').style.display=this.value===\'monthly\'?\'block\':\'none\'">'+opts([['daily','Every day'],['weekly','Once a week'],['monthly','Once a month']])+'</select></div></div>'+
 '<div id="tk_dw" style="display:none"><label>Which day</label><select id="tk_w">'+opts(DAYS.map((d,i)=>[i,d]),3)+'</select></div>'+
 '<div id="tk_dm" style="display:none"><label>Date of month (1–31)</label><input type="number" id="tk_m" min="1" max="31" value="1"></div>'+
 '<button class="btn" style="margin-top:10px" onclick="addTask()">Add</button></div><button class="btn sec full" onclick="closeModal();render()">Close</button>';
 openModal(h);
}
function addTask(){const t=v('tk_t').trim();if(!t)return toast('Enter activity');const f=v('tk_f');S.tasks.push({id:uid(),title:t,block:v('tk_b'),freq:f,day:f==='weekly'?+v('tk_w'):f==='monthly'?Math.min(31,Math.max(1,+v('tk_m')||1)):null});save();editTasks();toast('Added')}
function delTask(id){if(!confirm('Remove this activity?'))return;S.tasks=S.tasks.filter(t=>t.id!==id);save();editTasks()}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('showroom-backup-'+todayStr()+'.json',JSON.stringify(S),'application/json');toast('Backup downloaded')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.tasks)throw 0;if(!confirm('Replace current data with this backup?'))return;S=d;save();render();toast('Backup restored')}catch(e){toast('Not a valid backup file')}};r.readAsText(f)}
function salesCSV(){let c='Date,Gold (g),Diamond (ct),Silver (g),Monthly Scheme (Rs),Pre-Booking (Rs),Walk-ins,Converted\n';Object.keys(S.sales).sort().forEach(k=>{const s=S.sales[k];c+=k+','+SF.map(f=>s[f[0]]??'').join(',')+'\n'});dl('showroom-sales-'+todayStr()+'.csv',c,'text/csv');toast('CSV downloaded')}
function resetAll(){if(!confirm('This deletes ALL data on this phone. Take a backup first. Continue?'))return;if(!confirm('Are you sure?'))return;S=defaults();save();render()}

/* ===== Helpers ===== */
function v(id){const e=document.getElementById(id);return e?e.value:''}
function openModal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
let tt;function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:70;max-width:90%;text-align:center';document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2200)}

render();checkAlarms();
</script>
</body>
</html>
